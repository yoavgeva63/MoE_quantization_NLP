# Qwen1.5-MoE-A2.7B: second architecture.
# 14.3B total / 2.7B active, 24 layers, 60 experts, top-4, plus a shared expert. That
# expert's gate is quantized like everything else: it is a scalar mixing weight, not a
# choice among experts, so protecting it would make `mixed` mean something broader here
# than on OLMoE. See registry.py. ~28.6GB in BF16, which device_map shards across five
# RTX 2080 Ti.

model_key: qwen
dtype: bfloat16
device: cuda

corpus: wikitext2
ppl_seq_len: 1024
ppl_stride: 1024
max_ppl_windows: null

routing_sequences: 128
routing_seq_len: 256

capture_inputs: true
input_stride: 8

seed: 42
n_boot: 200

results_dir: results
